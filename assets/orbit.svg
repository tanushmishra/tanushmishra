<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DDD0BC" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#DDD0BC" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="300" cy="300" r="260" fill="url(#glow)" />

  <!-- static guide rings -->
  <circle cx="300" cy="300" r="100" fill="none" stroke="#DDD0BC" stroke-width="1" stroke-dasharray="2 6" opacity="0.6" />
  <circle cx="300" cy="300" r="160" fill="none" stroke="#DDD0BC" stroke-width="1" stroke-dasharray="2 6" opacity="0.5" />
  <circle cx="300" cy="300" r="220" fill="none" stroke="#DDD0BC" stroke-width="1" stroke-dasharray="2 6" opacity="0.4" />

  <!-- center mark -->
  <circle cx="300" cy="300" r="46" fill="#2B2620" />
  <text x="300" y="296" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#FAF7F2" font-weight="600">TM</text>
  <text x="300" y="312" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8.5" letter-spacing="1.5" fill="#DDD0BC">BUILDER</text>

  <!-- ring 1 : inner, fast — core stack -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 300 300" to="360 300 300" dur="18s" repeatCount="indefinite" />
    <g transform="translate(300,200)">
      <circle r="24" fill="#8C7B6B" />
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#FAF7F2" font-weight="600">Py</text>
    </g>
    <g transform="translate(386.6,250) rotate(60)">
      <circle r="24" fill="#8C7B6B" transform="rotate(-60)" />
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#FAF7F2" font-weight="600" transform="rotate(-60)">React</text>
    </g>
    <g transform="translate(386.6,350) rotate(120)">
      <circle r="24" fill="#8C7B6B" transform="rotate(-120)" />
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#FAF7F2" font-weight="600" transform="rotate(-120)">API</text>
    </g>
    <g transform="translate(300,400) rotate(180)">
      <circle r="24" fill="#8C7B6B" transform="rotate(-180)" />
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#FAF7F2" font-weight="600" transform="rotate(-180)">C++</text>
    </g>
    <g transform="translate(213.4,350) rotate(240)">
      <circle r="24" fill="#8C7B6B" transform="rotate(-240)" />
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#FAF7F2" font-weight="600" transform="rotate(-240)">SQL</text>
    </g>
    <g transform="translate(213.4,250) rotate(300)">
      <circle r="24" fill="#8C7B6B" transform="rotate(-300)" />
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#FAF7F2" font-weight="600" transform="rotate(-300)">Git</text>
    </g>
  </g>

  <!-- ring 2 : mid, medium — AI layer -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 300 300" to="0 300 300" dur="28s" repeatCount="indefinite" />
    <g transform="translate(300,140)">
      <circle r="28" fill="#A99985" />
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#2B2620" font-weight="700">AI/ML</text>
    </g>
    <g transform="translate(438.6,220) rotate(90)">
      <circle r="28" fill="#A99985" transform="rotate(-90)" />
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#2B2620" font-weight="700" transform="rotate(-90)">Vision</text>
    </g>
    <g transform="translate(438.6,380) rotate(180)">
      <circle r="28" fill="#A99985" transform="rotate(-180)" />
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#2B2620" font-weight="700" transform="rotate(-180)">Edge&#160;AI</text>
    </g>
    <g transform="translate(300,460) rotate(270)">
      <circle r="28" fill="#A99985" transform="rotate(-270)" />
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#2B2620" font-weight="700" transform="rotate(-270)">RAG</text>
    </g>
    <g transform="translate(161.4,220) rotate(-90)">
      <circle r="28" fill="#A99985" transform="rotate(90)" />
      <text x="0" y="4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#2B2620" font-weight="700" transform="rotate(90)">Automate</text>
    </g>
  </g>

  <!-- ring 3 : outer, slow — product layer -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 300 300" to="360 300 300" dur="42s" repeatCount="indefinite" />
    <g transform="translate(300,80)">
      <circle r="20" fill="#2B2620" stroke="#DDD0BC" stroke-width="1.5" />
      <text x="0" y="3.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#FAF7F2" font-weight="600">Product</text>
    </g>
    <g transform="translate(490.5,190) rotate(72)">
      <circle r="20" fill="#2B2620" stroke="#DDD0BC" stroke-width="1.5" transform="rotate(-72)" />
      <text x="0" y="3.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#FAF7F2" font-weight="600" transform="rotate(-72)">Design</text>
    </g>
    <g transform="translate(419.5,437) rotate(144)">
      <circle r="20" fill="#2B2620" stroke="#DDD0BC" stroke-width="1.5" transform="rotate(-144)" />
      <text x="0" y="3.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#FAF7F2" font-weight="600" transform="rotate(-144)">Startup</text>
    </g>
    <g transform="translate(180.5,437) rotate(216)">
      <circle r="20" fill="#2B2620" stroke="#DDD0BC" stroke-width="1.5" transform="rotate(-216)" />
      <text x="0" y="3.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#FAF7F2" font-weight="600" transform="rotate(-216)">Ship</text>
    </g>
    <g transform="translate(109.5,190) rotate(288)">
      <circle r="20" fill="#2B2620" stroke="#DDD0BC" stroke-width="1.5" transform="rotate(-288)" />
      <text x="0" y="3.5" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="8" fill="#FAF7F2" font-weight="600" transform="rotate(-288)">Scale</text>
    </g>
  </g>
</svg>

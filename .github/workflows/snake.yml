name: Generate Contribution Snake

on:
  schedule:
    # Runs once a day at 00:00 UTC — adjust as you like.
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: tanushmishra
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github&color_snake=#A99985&color_dots=#FAF7F2,#DDD0BC,#8C7B6B,#8C7B6B,#2B2620
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#DDD0BC&color_dots=#2B2620,#8C7B6B,#8C7B6B,#A99985,#FAF7F2

      - name: Push generated SVGs to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
